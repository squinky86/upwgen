<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#080e0b">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title }}</title>
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="site-header">
    <div class="site-shell">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="upwgen home"><span aria-hidden="true">&gt;_</span> upwgen<span class="brand-version"> / {{ site.version }}</span></a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="{{ '/#generator' | relative_url }}">Generator</a>
        <a href="{{ '/#analyzer' | relative_url }}">Analyzer</a>
        <a href="{{ '/guide/' | relative_url }}">Guide</a>
        <a href="{{ '/cli/' | relative_url }}">CLI</a>
        <a href="https://github.com/squinky86/upwgen" rel="noopener noreferrer">Source ↗</a>
      </nav>
    </div>
  </header>
  {{ content }}
  <footer class="site-footer">
    <div class="site-shell">
      <p>upwgen — the Unspeakable Password Generator. Built by Jon Hood. <a href="https://github.com/squinky86/upwgen/blob/main/LICENSE">GPL-3.0-or-later</a>.</p>
      <p><a href="{{ '/unicode/' | relative_url }}">Unicode &amp; privacy</a> · <a href="{{ '/releases/' | relative_url }}">Release notes</a> · <a href="https://github.com/squinky86/upwgen/releases/latest">Downloads</a></p>
    </div>
  </footer>
</body>
</html>
